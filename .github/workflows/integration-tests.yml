name: CI – Banking Transaction Processor

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  AWS_REGION: us-east-1
  STATE_MACHINE_NAME: banking-transaction-processor-dev
  TOFU_VERSION: "1.9.0"

jobs:
  ci:
    name: Format · Deploy · Test · Destroy
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Install OpenTofu ────────────────────────────────────────────────────
      - name: Install OpenTofu
        run: |
          curl -fsSL https://get.opentofu.org/install-opentofu.sh | \
            env INSTALL_OPENTOFU_VERSION=${{ env.TOFU_VERSION }} sh -s -- --install-method standalone
          tofu version

      # ── AWS credentials ─────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── tofu init ───────────────────────────────────────────────────────────
      - name: tofu init
        run: tofu init -input=false

      # ── tofu fmt ────────────────────────────────────────────────────────────
      - name: tofu fmt (check)
        run: tofu fmt -check -recursive

      # ── tofu apply ──────────────────────────────────────────────────────────
      - name: tofu apply
        run: tofu apply -auto-approve -input=false

      # ── Resolve State Machine ARN ───────────────────────────────────────────
      - name: Resolve State Machine ARN
        id: resolve_arn
        run: |
          ARN=$(aws stepfunctions list-state-machines \
            --query "stateMachines[?name=='${{ env.STATE_MACHINE_NAME }}'].stateMachineArn" \
            --output text)
          echo "ARN=$ARN" >> "$GITHUB_OUTPUT"
          echo "State Machine ARN: $ARN"

      # ── Helper function shared across test steps ────────────────────────────
      # (inline bash function re-declared in each step for simplicity)

      # ── Test 1: approved_mx_low ─────────────────────────────────────────────
      - name: "Test 1 – approved_mx_low (expects route=approved)"
        run: |
          EXEC_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "${{ steps.resolve_arn.outputs.ARN }}" \
            --input file://tests/approved_mx_low.json \
            --query executionArn --output text)

          STATUS=""
          for i in $(seq 1 12); do
            STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXEC_ARN" --query status --output text)
            echo "  [$i] $STATUS"
            [ "$STATUS" = "RUNNING" ] || break
            sleep 5
          done

          OUTPUT=$(aws stepfunctions describe-execution --execution-arn "$EXEC_ARN" --query output --output text)
          ROUTE=$(echo "$OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['route'])")

          [ "$STATUS" = "SUCCEEDED" ] || { echo "FAIL: status=$STATUS"; exit 1; }
          [ "$ROUTE"  = "approved"  ] || { echo "FAIL: route=$ROUTE";   exit 1; }
          echo "PASS"

      # ── Test 2: review_large_amount ─────────────────────────────────────────
      - name: "Test 2 – review_large_amount (expects route=review)"
        run: |
          EXEC_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "${{ steps.resolve_arn.outputs.ARN }}" \
            --input file://tests/review_large_amount.json \
            --query executionArn --output text)

          STATUS=""
          for i in $(seq 1 12); do
            STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXEC_ARN" --query status --output text)
            echo "  [$i] $STATUS"
            [ "$STATUS" = "RUNNING" ] || break
            sleep 5
          done

          OUTPUT=$(aws stepfunctions describe-execution --execution-arn "$EXEC_ARN" --query output --output text)
          ROUTE=$(echo "$OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['route'])")

          [ "$STATUS" = "SUCCEEDED" ] || { echo "FAIL: status=$STATUS"; exit 1; }
          [ "$ROUTE"  = "review"    ] || { echo "FAIL: route=$ROUTE";   exit 1; }
          echo "PASS"

      # ── Test 3: review_foreign_country ──────────────────────────────────────
      - name: "Test 3 – review_foreign_country (expects route=review)"
        run: |
          EXEC_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "${{ steps.resolve_arn.outputs.ARN }}" \
            --input file://tests/review_foreign_country.json \
            --query executionArn --output text)

          STATUS=""
          for i in $(seq 1 12); do
            STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXEC_ARN" --query status --output text)
            echo "  [$i] $STATUS"
            [ "$STATUS" = "RUNNING" ] || break
            sleep 5
          done

          OUTPUT=$(aws stepfunctions describe-execution --execution-arn "$EXEC_ARN" --query output --output text)
          ROUTE=$(echo "$OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['route'])")

          [ "$STATUS" = "SUCCEEDED" ] || { echo "FAIL: status=$STATUS"; exit 1; }
          [ "$ROUTE"  = "review"    ] || { echo "FAIL: route=$ROUTE";   exit 1; }
          echo "PASS"

      # ── Test 4: invalid_transaction ─────────────────────────────────────────
      - name: "Test 4 – invalid_transaction (expects SF status=FAILED)"
        run: |
          EXEC_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "${{ steps.resolve_arn.outputs.ARN }}" \
            --input file://tests/invalid_transaction.json \
            --query executionArn --output text)

          STATUS=""
          for i in $(seq 1 12); do
            STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXEC_ARN" --query status --output text)
            echo "  [$i] $STATUS"
            [ "$STATUS" = "RUNNING" ] || break
            sleep 5
          done

          [ "$STATUS" = "FAILED" ] || { echo "FAIL: status=$STATUS, expected FAILED"; exit 1; }
          echo "PASS"

      # ── Verify S3 output ─────────────────────────────────────────────────────
      - name: Verify S3 results
        run: |
          BUCKET="banking-transaction-processor-results-dev"
          aws s3 ls "s3://$BUCKET/" --recursive
          COUNT=$(aws s3 ls "s3://$BUCKET/" --recursive | wc -l | tr -d ' ')
          echo "Objects in S3: $COUNT"
          [ "$COUNT" -ge 3 ] || { echo "FAIL: expected >=3 objects, got $COUNT"; exit 1; }
          echo "PASS"

      # ── tofu destroy (always runs, even if tests fail) ───────────────────────
      - name: tofu destroy
        if: always()
        run: tofu destroy -auto-approve -input=false
